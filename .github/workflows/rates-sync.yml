name: rates-sync

# 每 30 分钟刷新 api/v3/simple/price（BEpusdt 的汇率同步源）。
# 为什么不跑在本地/网关：两边都访问不了 api.coingecko.com，GitHub runner 可以。
# 消费方：网关 conf rate_sync_coingecko_api_url =
#   https://gh-proxy.com/raw.githubusercontent.com/996-dev/bepusdt-rate/main
#   （jsDelivr 分支引用有 ~12h 解析缓存，purge 清不到，只作备用：fastly.jsdelivr.net/gh/996-dev/bepusdt-rate@main）
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rates-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync rates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
        run: node scripts/update-rates.mjs

      - name: Verify production channel (gh-proxy → raw)
        run: |
          set -e
          URL="https://gh-proxy.com/raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/api/v3/simple/price?ids=tether,usd-coin,tron,binancecoin,ethereum,the-open-network&vs_currencies=USD,CNY"
          for i in 1 2 3 4 5; do
            BODY=$(curl -sS --max-time 25 "$URL" -H 'cache-control: no-cache' || true)
            echo "attempt $i: ${BODY:0:200}"
            if echo "$BODY" | grep -q '"tether"'; then
              echo "production channel OK"
              exit 0
            fi
            sleep 10
          done
          echo "生产通道未返回有效 payload —— 网关会继续用旧汇率，需要人工介入"
          exit 1

      - name: Verify jsDelivr (backup, branch ref may lag)
        continue-on-error: true
        run: |
          URL="https://fastly.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/api/v3/simple/price?ids=tether&vs_currencies=usd"
          BODY=$(curl -sS --max-time 25 "$URL" || true)
          echo "jsdelivr: ${BODY:0:200}"
